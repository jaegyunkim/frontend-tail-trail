<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꼬리길 · 이용 신청</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=0.1.6-25"></head><body><main class="login-view"><section class="login-card"><h1>꼬리길 이용 신청</h1><p>관리자 승인 후 신청하신 이메일로 임시 비밀번호를 안내해 드려요.</p><form id="requestForm"><label>이메일 아이디<span class="clearable"><input name="loginId" type="email" maxlength="254" placeholder="test@gmail.com" required autocomplete="email" autocapitalize="none" spellcheck="false" data-clearable><button type="button" class="clear-btn" aria-label="입력한 이메일 지우기" hidden><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="9"/><path d="M7 7l6 6M13 7l-6 6"/></svg></button></span></label><p id="dupCheck" class="dup-check" role="status" aria-live="polite" hidden></p><label>닉네임<span class="clearable"><input name="displayName" maxlength="40" required data-clearable><button type="button" class="clear-btn" aria-label="입력한 닉네임 지우기" hidden><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="9"/><path d="M7 7l6 6M13 7l-6 6"/></svg></button></span></label><p class="beta-note"><b>베타 테스트 서비스</b> · 초대·승인된 베타 테스터만 이용하며, 기능과 이용 조건은 예고 없이 바뀔 수 있어요.<br>이용 신청 처리(승인·안내 메일)를 위해 이메일 아이디와 닉네임만 받고, 처리 후 30일 이내 삭제해요.</p><p class="hint" id="signupPolicy">승인 후 베타 테스터 역할의 고정 한도가 적용돼요.</p><button id="registerSubmit" type="submit">가입 신청하기</button></form><p id="result" role="status" aria-live="polite" hidden></p><a class="back-to-login" href="./">로그인 화면으로 돌아가기</a></section></main><dialog id="registrationSuccess" class="registration-dialog" aria-labelledby="successTitle" aria-describedby="successDescription"><form method="dialog"><h2 id="successTitle">이용 신청이 접수됐어요</h2><p id="successDescription" style="white-space:pre-line">관리자가 확인한 뒤, 신청하신 이메일로 임시 비밀번호를 안내해 드릴게요. 조금만 기다려 주세요.</p><button type="submit" autofocus>확인</button></form></dialog><script src="config.js?v=0.1.6"></script><script src="telemetry.js?v=0.1.6"></script><script src="register.js?v=0.1.6" type="module"></script><script src="visit.js?v=0.1.6" type="module"></script></body></html>
